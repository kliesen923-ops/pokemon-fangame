<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1c28">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>포켓몬 새싹 모험</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="screen-wrap">
    <canvas id="screen" width="240" height="176"></canvas>
    <div id="ui"></div>
    <div id="mapname"></div>
    <div id="fade"></div>
    <div id="loading">불러오는 중…</div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button data-key="up" class="up" aria-label="위">▲</button>
      <button data-key="left" class="left" aria-label="왼쪽">◀</button>
      <button data-key="right" class="right" aria-label="오른쪽">▶</button>
      <button data-key="down" class="down" aria-label="아래">▼</button>
    </div>
    <div class="mid"><button data-key="start" class="start">MENU</button></div>
    <div class="ab">
      <button data-key="b" class="b">B</button>
      <button data-key="a" class="a">A</button>
    </div>
  </div>
  <div id="help">PC: 방향키 이동 · Z/Enter 결정 · X/Esc 취소·메뉴</div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
